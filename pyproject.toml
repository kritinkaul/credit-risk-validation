[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "credit-risk-validation"
version = "0.1.0"
description = "Reproducible credit default modeling and model evaluation research foundation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kritin Kaul"}]
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
modeling = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "lightgbm>=4.6,<5"]
analytics = ["duckdb>=1.4,<2"]
visualization = ["matplotlib>=3.10,<4", "seaborn>=0.13,<1"]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
